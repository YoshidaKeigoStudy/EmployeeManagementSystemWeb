<!DOCTYPE html>
<html>
	<head>
		<title>編集画面</title>
		<meta charset="UTF-8">
	</head>
	<body>
		<h1>編集画面</h1>
		<form action="/employees/edit" method="post">
			<p>社員ID　：
			<input type="text" name="employeeId" th:value="${employee.employeeId}" readonly></p>
			<p>名前　：
			<input type="text" name="name" th:value="${employee.name}"></p>
			<p>年齢　：
			<input type="number" name="age" th:value="${employee.age}"></p>
			<p>部署　：
			<input type="text" name="department" th:value="${employee.department}"></p>
			<p><input type="submit" value="更新する"></p>
		</form>
		<form action="employees" method="get">
			<button name="btn_submit" type="submit">社員一覧</button>
		</form>
		<form action="/" method="get">
			<button name="btn_submit" type="submit">目次</button>
		</form>
	</body>
</html>
