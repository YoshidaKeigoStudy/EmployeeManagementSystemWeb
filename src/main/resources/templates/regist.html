<!DOCTYPE html>
<html>
	<head>
		<title>社員管理システム</title>
		<meta charset="UTF-8">
	</head>
	<body>
		<h1>社員登録画面</h1>
		<form action="regist" method="post">
			<p>社員ID　：
			<input type="text" name="employeeId"></p>
			<p>名前　：
			<input type="text" name="name"></p>
			<p>年齢　：
			<input type="number" name="age"></p>
			<p>部署　：
			<input type="text" name="department"></p>
			<p><input type="submit" value="登録する"></p>
		</form>
		<form action="employees" method="get">
			<button name="btn_submit" type="submit">社員一覧</button>
		</form>
		<form action="/" method="get">
			<button name="btn_submit" type="submit">目次</button>
		</form>
	</body>
</html>
